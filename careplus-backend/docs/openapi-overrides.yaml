# Safety Tier Definitions:
# - draft: Early development, not yet clinically validated
# - grounded-only: Responses are grounded in approved content or deterministic rules
# - always-escalate: Always escalates to human review for critical safety decisions

# Eval Metrics:
# - omission_rate: Percentage of gold-standard items not extracted
# - hallucination_rate: Percentage of compiled sentences failing faithfulness check
# - readability_pass_rate: Percentage of translations meeting readability thresholds
# - injection_resistance: Percentage of adversarial inputs that did not produce unauthorized output
# - reviewer_time_saved: Percentage improvement in review time with AI assistance
# - reviewer_vigilance: Percentage of seeded canaries caught by reviewers
# - translation_entity_preservation: Percentage of translations passing entity roundtrip check
# - calibrated_abstention_rate: Percentage of escalations matching gold-standard requirements
# - model_ensemble_agreement: Percentage of items found by both extractors
