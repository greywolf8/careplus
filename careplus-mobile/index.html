<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CarePlus Mobile Patient & Caregiver Coordinator</title>
    <meta name="description" content="Mobile PWA discharge and follow-up care coordinator for patients and caregivers." />
    <meta property="og:title" content="CarePlus Mobile Patient & Caregiver Coordinator" />
    <meta property="og:description" content="Mobile PWA discharge and follow-up care coordinator for patients and caregivers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CarePlus" />
    <meta name="application-name" content="CarePlus" />
    <meta name="msapplication-TileColor" content="#0f766e" />
    
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- Google Fonts: Plus Jakarta Sans for clean high-legibility medical UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Early global PWA install event capture & Service Worker registration -->
    <script>
      window.__careplus_deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__careplus_deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('careplus-pwa-ready'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[CarePlus PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[CarePlus PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-800 antialiased select-none touch-manipulation font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
